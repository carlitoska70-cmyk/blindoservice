name: Novità da associazioni ed enti

# Monday at 06:00 UTC (08:00 in Italy in summer): FIPE, Confcommercio, Confesercenti/FIEPET,
# Comune di Palermo, Regione, Gazzetta Ufficiale and other official sources.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  novita:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Cerca le novità
        env:
          PRESIDIO_URL: ${{ secrets.PRESIDIO_URL }}
          PRESIDIO_REMINDER_TOKEN: ${{ secrets.PRESIDIO_REMINDER_TOKEN }}
        run: |
          if [ -z "$PRESIDIO_URL" ] || [ -z "$PRESIDIO_REMINDER_TOKEN" ]; then
            echo "Segreti non configurati (vedi CONFIGURA_PROMEMORIA.command): salto."
            exit 0
          fi
          curl --fail-with-body -sS -m 240 -X POST "$PRESIDIO_URL/api/novita" \
            -H "Authorization: Bearer $PRESIDIO_REMINDER_TOKEN"
